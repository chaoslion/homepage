[project]
name = "homepage"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "graphviz>=0.21",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rclone-python>=0.1.25",
    "scipy>=1.18.1",
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.hatch.build.targets.wheel]
packages = ["content/content"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
